services:
  - type: web
    name: streamloop
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: streamloop-uploads
      mountPath: /app/public/uploads
      sizeGB: 1
